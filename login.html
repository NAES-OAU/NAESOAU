<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In | NAES-OAU</title>
<style>
  :root {
    --navy: #0b1f4b; --navy-deep: #07142f; --gold: #d4a62a; --paper: #fbf8f0;
    --ink: #1a2238; --muted: #5d6680; --error: #b3261e; --ok: #1d6b3a; --line: #c9cdd9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header.top {
    background: var(--navy); border-bottom: 4px solid var(--gold);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px;
  }
  header.top a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
  header.top img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #fff; }
  header.top .name { font-weight: 700; font-size: 1.05rem; line-height: 1.15; }
  header.top .sub { font-size: .78rem; color: #c8d0e6; font-weight: 400; }
  main { flex: 1; display: grid; place-items: center; padding: 28px 16px; }
  .card {
    width: 100%; max-width: 420px; background: #fff;
    border: 1px solid #e3e5ec; border-radius: 8px; padding: 30px 28px 24px;
    box-shadow: 0 10px 30px rgba(11, 31, 75, .08);
  }
  .card img.logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; display: block; margin-bottom: 14px; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; color: var(--navy); }
  p.lead { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: .95rem; }
  .field { position: relative; }
  input {
    width: 100%; padding: 12px 64px 12px 12px; font-size: 1rem;
    border: 1.5px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  input.plain { padding-right: 12px; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--navy); font-weight: 600;
    font-size: .85rem; cursor: pointer; padding: 6px 8px;
  }
  .submit {
    width: 100%; margin-top: 22px; padding: 13px; font-size: 1rem; font-weight: 700;
    color: var(--navy-deep); background: var(--gold); border: 0; border-radius: 6px; cursor: pointer;
  }
  .submit:hover { filter: brightness(1.06); }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; font-size: .92rem; }
  .links a { color: var(--navy); font-weight: 600; }
  .msg { margin-top: 14px; font-size: .92rem; line-height: 1.45; min-height: 1.2em; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .hidden { display: none; }
  .linkbtn { background: none; border: 0; color: var(--navy); font-weight: 600; cursor: pointer; padding: 0; font-size: .92rem; text-decoration: underline; }
</style>
</head>
<body>
<header class="top">
  <a href="/" id="homeLink">
    <img id="topLogo" alt="" src="/logo.png" onerror="this.style.display='none'">
    <span class="name">NAES-OAU<br><span class="sub">Entrepreneurship Students, Obafemi Awolowo University</span></span>
  </a>
</header>

<main>
  <section class="card">
    <img class="logo" id="cardLogo" alt="NAESOAU logo" src="/logo.png" onerror="this.style.display='none'">
    <h1>Sign In</h1>
    <p class="lead">Students and executives use the same sign-in.</p>

    <!-- Step 1: email and password -->
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" class="plain" type="email" autocomplete="username" required>

      <label for="pw">Password</label>
      <div class="field">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="toggle">Show</button>
      </div>

      <button class="submit" id="signin" type="submit">Sign In</button>
      <div class="links">
        <a href="/forgot-password.html" id="forgotLink">Forgot password?</a>
        <a href="/register.html" id="registerLink">New student? Register</a>
      </div>
    </form>

    <!-- Step 2: 2-step verification code (only shown if the account has it turned on) -->
    <form id="mfaForm" class="hidden" novalidate>
      <label for="code">6-Digit Code From Your Authenticator App</label>
      <input id="code" class="plain" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <button class="submit" id="verify" type="submit">Verify and Continue</button>
      <div class="links"><button type="button" class="linkbtn" id="cancelMfa">Use a different account</button></div>
    </form>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ===== EDIT THESE (same Supabase values as your other pages) =====
  const SUPABASE_URL = 'https://aecgqcgprmyohdikiduf.supabase.co/rest/v1/';
  const SUPABASE_ANON_KEY = 'sb_publishable_n2x1oa3eVJHhxQ__Gc4Ybg_e0ifpPcR';

  const ADMIN_URL   = '/admin.html';    // executives go here after signing in
  const STUDENT_URL = '/receipt.html';  // students go here after signing in
  const REGISTER_URL = '/register.html';
  const FORGOT_URL  = '/forgot-password.html';
  const LOGO_URL    = '/logo.png';      // your NAESOAU logo file

  // Executives are recognised by their email in this table.
  const ROLES_TABLE = 'executives';
  const EMAIL_COLUMN = 'email';
  // =================================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const msg = $('msg');
  const loginForm = $('loginForm');
  const mfaForm = $('mfaForm');

  $('topLogo').src = LOGO_URL;
  $('cardLogo').src = LOGO_URL;
  $('registerLink').href = REGISTER_URL;
  $('forgotLink').href = FORGOT_URL;

  function show(text, type) { msg.textContent = text; msg.className = 'msg ' + (type || ''); }

  $('toggle').addEventListener('click', () => {
    const input = $('pw');
    const hide = input.type === 'text';
    input.type = hide ? 'password' : 'text';
    $('toggle').textContent = hide ? 'Show' : 'Hide';
  });

  // Send executives to the admin area and everyone else to the student page.
  async function go(user) {
    show('Signed in. Taking you in…', 'ok');
    let destination = STUDENT_URL;
    try {
      const { data } = await sb.from(ROLES_TABLE)
        .select(EMAIL_COLUMN)
        .eq(EMAIL_COLUMN, user.email)
        .maybeSingle();
      if (data) destination = ADMIN_URL;
    } catch (_) { /* treat as student if the lookup is not allowed */ }
    window.location.href = destination;
  }

  // After the password is accepted, ask for the 2-step code if the account needs one.
  async function continueAfterPassword(user) {
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal && aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2') {
      loginForm.classList.add('hidden');
      mfaForm.classList.remove('hidden');
      $('code').focus();
      show('Enter the code from your authenticator app.');
      return;
    }
    await go(user);
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const password = $('pw').value;
    if (!email || !password) return show('Enter your email and password.', 'error');

    $('signin').disabled = true;
    show('Signing in…');

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      $('signin').disabled = false;
      const m = error.message || '';
      if (/invalid login/i.test(m)) return show('Email or password is incorrect.', 'error');
      if (/not confirmed/i.test(m)) return show('Your email is not confirmed yet. Check your inbox for the confirmation link.', 'error');
      return show(m, 'error');
    }
    $('signin').disabled = false;
    await continueAfterPassword(data.user);
  });

  mfaForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = $('code').value.replace(/\s/g, '');
    if (!/^\d{6}$/.test(code)) return show('Enter the 6-digit code.', 'error');

    $('verify').disabled = true;
    show('Checking code…');

    const { data: factors } = await sb.auth.mfa.listFactors();
    const factor = factors && factors.totp && factors.totp[0];
    if (!factor) { $('verify').disabled = false; return show('No authenticator is set up on this account.', 'error'); }

    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
    if (error) {
      $('verify').disabled = false;
      return show('That code is not correct or has expired. Try the latest code.', 'error');
    }
    const { data } = await sb.auth.getUser();
    await go(data.user);
  });

  $('cancelMfa').addEventListener('click', async () => {
    await sb.auth.signOut();
    mfaForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
    $('pw').value = '';
    show('');
  });

  // If they are already signed in, skip the form.
  (async () => {
    const { data } = await sb.auth.getSession();
    if (data.session) await continueAfterPassword(data.session.user);
  })();
</script>
</body>
</html>
