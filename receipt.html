<main class="wrap">
  <h1 class="page-title">Download Receipt</h1>
  <form id="rf" novalidate>
    <p class="hint">After the executives confirm your payment, enter your details to get your receipt. Use the WhatsApp number you registered with.</p>
    <label>Registration Number/Matric Number<input id="rcReg" placeholder="ERT/2022/041 or JAMB number" autocapitalize="characters" autocomplete="off"></label>
    <label>WhatsApp Number<input id="rcPhone" type="tel" autocomplete="tel"></label>
    <label class="check"><input type="checkbox" id="keepRc"><span>Remember my matric number and WhatsApp number on this device, so I do not have to type them again. Only tick this on your own phone.</span></label>
    <button class="btn" id="rcBtn" type="submit">Get Receipt</button>
    <div class="msg" id="rmsg" role="status"></div>
    <canvas id="rcv" width="1000" height="1600" style="display:none;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)"></canvas>
    <button class="btn" id="rcDl" type="button" style="display:none">Download Receipt</button>
  </form>
