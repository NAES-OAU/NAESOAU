<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password | NAESOAU</title>
<style>
  :root {
    --navy: #0b1f4b;
    --navy-deep: #07142f;
    --gold: #d4a62a;
    --paper: #fbf8f0;
    --ink: #1a2238;
    --muted: #5d6680;
    --error: #b3261e;
    --ok: #1d6b3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--navy-deep);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border-top: 6px solid var(--gold);
    border-radius: 6px;
    padding: 32px 28px 28px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .4);
  }
  h1 { margin: 0 0 6px; font-size: 1.5rem; color: var(--navy); }
  p.lead { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .95rem; }
  .field { position: relative; }
  input {
    width: 100%;
    padding: 12px 64px 12px 12px;
    font-size: 1rem;
    border: 1.5px solid #c9cdd9;
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }
  .toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--navy);
    font-weight: 600; font-size: .85rem; cursor: pointer; padding: 6px 8px;
  }
  .submit {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--navy-deep);
    background: var(--gold);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .submit:hover { filter: brightness(1.06); }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: .92rem; line-height: 1.45; min-height: 1.2em; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 6px; }
  .back { display: inline-block; margin-top: 18px; color: var(--navy); font-weight: 600; font-size: .92rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<main class="card">
  <h1>Change Password</h1>
  <p class="lead" id="lead">Checking your login…</p>

  <form id="form" class="hidden" novalidate>
    <label for="cur">Current Password</label>
    <div class="field">
      <input id="cur" type="password" autocomplete="current-password" required>
      <button type="button" class="toggle" data-target="cur">Show</button>
    </div>

    <label for="pw">New Password</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="toggle" data-target="pw">Show</button>
    </div>
    <div class="hint">At least 8 characters, and different from your current password.</div>

    <label for="pw2">Confirm New Password</label>
    <div class="field">
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="toggle" data-target="pw2">Show</button>
    </div>

    <button class="submit" id="save" type="submit">Update Password</button>
  </form>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <a class="back" id="back" href="/admin.html">Back to Admin</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ===== EDIT THESE (same values you used in set-password.html) =====
  const SUPABASE_URL = 'https://aecgqcgprmyohdikiduf.supabase.co/rest/v1/';
  const SUPABASE_ANON_KEY = 'sb_publishable_n2x1oa3eVJHhxQ__Gc4Ybg_e0ifpPcR';
  const ADMIN_URL = '/admin.html';
  const LOGIN_URL = '/admin.html'; // where executives sign in
  // ==================================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // Separate throwaway client used only to verify the current password,
  // so the executive's real session (and any 2-step verification) is untouched.
  const verifier = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });

  const lead = document.getElementById('lead');
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const saveBtn = document.getElementById('save');
  document.getElementById('back').href = ADMIN_URL;

  function show(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + (type || '');
  }

  let email = null;

  (async () => {
    const { data } = await sb.auth.getSession();
    if (!data.session) {
      lead.textContent = 'You are not signed in.';
      show('Sign in to your executive account first, then open this page again.', 'error');
      document.getElementById('back').href = LOGIN_URL;
      document.getElementById('back').textContent = 'Go to Sign In';
      return;
    }
    email = data.session.user.email;
    lead.textContent = 'Signed in as ' + email + '. Enter your current password, then choose a new one.';
    form.classList.remove('hidden');
  })();

  document.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const hide = input.type === 'text';
      input.type = hide ? 'password' : 'text';
      btn.textContent = hide ? 'Show' : 'Hide';
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const cur = document.getElementById('cur').value;
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;

    if (!cur) return show('Enter your current password.', 'error');
    if (pw.length < 8) return show('New password must be at least 8 characters.', 'error');
    if (pw !== pw2) return show('The new passwords do not match.', 'error');
    if (pw === cur) return show('Your new password must be different from the current one.', 'error');

    saveBtn.disabled = true;
    show('Checking your current password…');

    const { error: verifyErr } = await verifier.auth.signInWithPassword({ email, password: cur });
    if (verifyErr) {
      saveBtn.disabled = false;
      return show('Your current password is incorrect.', 'error');
    }

    show('Updating…');
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) {
      saveBtn.disabled = false;
      return show(error.message, 'error');
    }

    form.reset();
    show('Password updated. Use your new password the next time you sign in.', 'ok');
    saveBtn.disabled = false;
  });
</script>
</body>
</html>
