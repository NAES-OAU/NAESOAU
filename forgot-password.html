<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password | NAESOAU</title>
<style>
  :root {
    --navy: #0b1f4b; --navy-deep: #07142f; --gold: #d4a62a; --paper: #fbf8f0;
    --ink: #1a2238; --muted: #5d6680; --error: #b3261e; --ok: #1d6b3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--navy-deep); color: var(--ink);
    display: grid; place-items: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--paper);
    border-top: 6px solid var(--gold); border-radius: 6px;
    padding: 32px 28px 28px; box-shadow: 0 18px 50px rgba(0,0,0,.4);
  }
  h1 { margin: 0 0 6px; font-size: 1.5rem; color: var(--navy); }
  p.lead { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .95rem; }
  input {
    width: 100%; padding: 12px; font-size: 1rem;
    border: 1.5px solid #c9cdd9; border-radius: 4px; background: #fff; color: var(--ink);
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .submit {
    width: 100%; margin-top: 22px; padding: 13px; font-size: 1rem; font-weight: 700;
    color: var(--navy-deep); background: var(--gold); border: 0; border-radius: 4px; cursor: pointer;
  }
  .submit:hover { filter: brightness(1.06); }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: .92rem; line-height: 1.45; min-height: 1.2em; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .back { display: inline-block; margin-top: 18px; color: var(--navy); font-weight: 600; font-size: .92rem; }
</style>
</head>
<body>
<main class="card">
  <h1>Forgot Password</h1>
  <p class="lead">Enter the email address of your executive account. If it matches an account, we will send you a link to reset your password.</p>

  <form id="form" novalidate>
    <label for="email">Email Address</label>
    <input id="email" type="email" autocomplete="email" required>
    <button class="submit" id="send" type="submit">Send Reset Link</button>
  </form>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <a class="back" id="back" href="/admin.html">Back to Sign In</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ===== EDIT THESE (same values as your other pages) =====
  const SUPABASE_URL = 'https://aecgqcgprmyohdikiduf.supabase.co/rest/v1/';
  const SUPABASE_ANON_KEY = 'sb_publishable_n2x1oa3eVJHhxQ__Gc4Ybg_e0ifpPcR';
  const SITE_URL = 'https://naesoau1.vercel.app';
  const LOGIN_URL = '/admin.html';
  // ========================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  document.getElementById('back').href = LOGIN_URL;

  function show(text, type) { msg.textContent = text; msg.className = 'msg ' + (type || ''); }

  function cooldown(seconds) {
    let left = seconds;
    sendBtn.disabled = true;
    const t = setInterval(() => {
      sendBtn.textContent = 'Send Again in ' + left + 's';
      if (--left < 0) { clearInterval(t); sendBtn.disabled = false; sendBtn.textContent = 'Send Reset Link'; }
    }, 1000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('Enter a valid email address.', 'error');

    sendBtn.disabled = true;
    show('Sending…');

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: SITE_URL.replace(/\/$/, '') + '/reset-password.html'
    });

    if (error) {
      sendBtn.disabled = false;
      const limited = /rate|seconds|too many/i.test(error.message);
      return show(limited ? 'Please wait a minute before asking for another link.' : error.message, 'error');
    }

    // Same message whether or not the email exists, so nobody can probe for accounts.
    show('If that email belongs to an executive account, a reset link is on its way. Check your inbox and spam folder. The link works once and expires after a while.', 'ok');
    cooldown(60);
  });
</script>
</body>
</html>
