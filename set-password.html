<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Your Password | NAESOAU</title>
<style>
  :root {
    --navy: #0b1f4b;
    --navy-deep: #07142f;
    --gold: #d4a62a;
    --paper: #fbf8f0;
    --ink: #1a2238;
    --muted: #5d6680;
    --error: #b3261e;
    --ok: #1d6b3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--navy-deep);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border-top: 6px solid var(--gold);
    border-radius: 6px;
    padding: 32px 28px 28px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .4);
  }
  h1 { margin: 0 0 6px; font-size: 1.5rem; color: var(--navy); }
  p.lead { margin: 0 0 22px; color: var(--muted); line-height: 1.5; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .95rem; }
  .field { position: relative; }
  input {
    width: 100%;
    padding: 12px 64px 12px 12px;
    font-size: 1rem;
    border: 1.5px solid #c9cdd9;
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }
  .toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--navy);
    font-weight: 600; font-size: .85rem; cursor: pointer; padding: 6px 8px;
  }
  .submit {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--navy-deep);
    background: var(--gold);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .submit:hover { filter: brightness(1.06); }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: .92rem; line-height: 1.45; min-height: 1.2em; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 6px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .submit { transition: filter .15s; }
  }
</style>
</head>
<body>
<main class="card">
  <h1>Set Your Password</h1>
  <p class="lead" id="lead">Checking your invite link…</p>

  <form id="form" class="hidden" novalidate>
    <label for="pw">New Password</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="toggle" data-target="pw">Show</button>
    </div>
    <div class="hint">At least 8 characters.</div>

    <label for="pw2">Confirm Password</label>
    <div class="field">
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="toggle" data-target="pw2">Show</button>
    </div>

    <button class="submit" id="save" type="submit">Save Password</button>
  </form>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ===== EDIT THESE THREE LINES (copy from your existing site's Supabase config) =====
  const SUPABASE_URL = 'https://aecgqcgprmyohdikiduf.supabase.co/rest/v1/';
  const SUPABASE_ANON_KEY = 'sb_publishable_n2x1oa3eVJHhxQ__Gc4Ybg_e0ifpPcR';
  const ADMIN_URL = '/admin.html'; // where to send the admin after saving the password
  // ===================================================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const lead = document.getElementById('lead');
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const saveBtn = document.getElementById('save');

  function show(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + (type || '');
  }

  function ready() {
    lead.textContent = 'Welcome. Choose a password to finish setting up your executive account.';
    form.classList.remove('hidden');
    show('');
  }

  function failed(text) {
    lead.textContent = 'This link cannot be used.';
    form.classList.add('hidden');
    show(text, 'error');
  }

  // Supabase puts errors (expired or used links) in the URL hash.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hashParams.get('error')) {
    failed('This invite link has expired or was already used. Ask a Super Admin to send you a new invite.');
  } else {
    let resolved = false;

    sb.auth.onAuthStateChange((event, session) => {
      if (session && !resolved) { resolved = true; ready(); }
    });

    // Fallback if the session was already picked up before the listener attached.
    setTimeout(async () => {
      if (resolved) return;
      const { data } = await sb.auth.getSession();
      if (data.session) { resolved = true; ready(); }
      else failed('No invite found. Open the link from your invite email in your browser, or ask for a new invite.');
    }, 1500);
  }

  document.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const hide = input.type === 'text';
      input.type = hide ? 'password' : 'text';
      btn.textContent = hide ? 'Show' : 'Hide';
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw.length < 8) return show('Password must be at least 8 characters.', 'error');
    if (pw !== pw2) return show('The two passwords do not match.', 'error');

    saveBtn.disabled = true;
    show('Saving…');

    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) {
      saveBtn.disabled = false;
      return show(error.message, 'error');
    }

    show('Password saved. Taking you to the admin page…', 'ok');
    setTimeout(() => { window.location.href = ADMIN_URL; }, 1200);
  });
</script>
</body>
</html>
