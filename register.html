<body>
<header>
  <a href="index.html" aria-label="NAES-OAU home"><img class="logo" alt="NAES-OAU logo" src="logo.png"></a>
  <a class="brand" href="index.html"><b>NAES-OAU</b><small>Entrepreneurship Students · Ile-Ife</small></a>
<button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
</header>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="menu" aria-label="Pages">
  <div class="drawer-top"><b>Menu</b><button class="drawer-close" id="menuClose" type="button" aria-label="Close menu">&times;</button></div>
  <a href="index.html">Home</a>
  <a href="welcome.html">Welcome</a>

  <div class="drawer-foot" id="menuWho"></div>
</nav>
<main class="wrap">
  <h1 class="page-title">Register</h1>
  <p class="sub">Join NAES-OAU. After you submit, we take you to the payment page.</p>
  <form id="f" novalidate>
    <label>Full Name<input id="fullName" autocomplete="name" required></label>
    <label>Registration Number/Matric Number<input id="reg" autocapitalize="characters" autocomplete="off"></label>
    <label>Date of Birth<span style="display:flex;gap:10px"><select id="dobMonth" aria-label="Month"></select><select id="dobDay" aria-label="Day"></select></span></label>
    <label>WhatsApp Number<input id="phone" type="tel" autocomplete="tel" required></label>
    <label>Email<input id="email" type="email" autocomplete="email" required></label>
    <label>Level<select id="level"><option>100 Level</option><option>200 Level (Regular)</option><option>200 Level (DE)</option><option>300 Level</option><option>400 Level</option></select></label>
    <label>Image<input id="photo" type="file" accept="image/*"></label>
    <img id="prev" alt="Image preview" style="display:none;width:96px;height:96px;object-fit:cover;border-radius:50%">
    <label class="check"><input type="checkbox" id="consent"><span>I agree that NAES-OAU may store my details, image and phone number to manage membership, dues and receipts. See the <a href="privacy.html" target="_blank" rel="noopener">Privacy Notice</a>.</span></label>
    <input id="rWeb" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
    <label class="check"><input type="checkbox" id="keep"><span>Remember my matric number and WhatsApp number on this device, so I do not have to type them again. Only tick this on your own phone.</span></label>
    <button class="btn" id="submit" type="submit">Submit Registration</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</main>
